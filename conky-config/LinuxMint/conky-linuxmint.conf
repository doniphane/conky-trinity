conky.config = {

    alignment = 'top_right',
    gap_x = 50,
    gap_y = 50,
    minimum_width = 300,
    maximum_width = 500,

    -- Apparence
    background = true,
    border_width = 1,
    draw_borders = true,
    draw_outline = false,
    draw_shades = true,
    draw_graph_borders = true,

    -- Couleurs Linux Mint (vert Mint + accents)
    default_color = 'e8e8e8',
    default_outline_color = 'white',
    default_shade_color = '1a1a1a',
    color1 = '87c540',  -- Vert Mint principal
    color2 = 'a8d86e',  -- Vert clair Mint
    color3 = 'f5a623',  -- Orange accent
    color4 = 'e8e8e8',  -- Gris clair texte
    color5 = '4a8b30',  -- Vert foncé bordures

    -- Fenêtre avec style Mint
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_colour = '1e1e2e',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Police
    use_xft = true,
    font = 'Roboto:size=9',
    xftalpha = 0.9,

    -- Performances
    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    double_buffer = true,

    -- Autres
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,

    -- Script Lua pour détection automatique
    lua_load = '~/.config/conky/conky-auto.lua',
}

conky.text = [[
${alignc}${color1}╔══════════════════════════╗
${alignc}${color1}║${color2}   LINUX MINT MONITOR   ${color1}║
${alignc}${color1}╚══════════════════════════╝${color}

${alignc}${color2}${font Roboto:bold:size=11}${time %H:%M}${font}
${alignc}${color}${font Roboto:size=10}${time %A %d %B %Y}${font}

${color1}┌─[ SYSTÈME ]${hr 2}${color}
${color2}│ OS:${color} ${execi 86400 lsb_release -d | cut -f 2}
${color2}│ Kernel:${color} ${kernel}  Uptime:${color} ${uptime_short}
${color1}└──────────────────────────────${color}

${color1}┌─[ PROCESSEUR ]${hr 2}${color}
${color2}│${color} ${freq_g} GHz ${acpitemp}°C ${cpu}%
${color1}│${color} ${cpugraph 20,298 4a8b30 87c540 -t}
${lua_parse show_cpus}
${color1}└──────────────────────────────${color}

${color1}┌─[ MÉMOIRE ]${hr 2}${color}
${color2}│ RAM:${color} ${mem} / ${memmax} ${alignr}${memperc}%
${color1}│${color} ${membar 6}
${color2}│ Swap:${color} ${swap} / ${swapmax} ${alignr}${swapperc}%
${color1}└──────────────────────────────${color}

${color1}┌─[ STOCKAGE ]${hr 2}${color}
${color2}│ /:${color} ${fs_used /} / ${fs_size /} ${alignr}${fs_used_perc /}%
${color1}│${color} ${fs_bar 6 /}
${color2}│ I/O:${color} ${diskio}
${color1}└──────────────────────────────${color}

${color1}┌─[ RÉSEAU ]${hr 2}${color}
${lua_parse show_network}
${color1}└──────────────────────────────${color}

${color1}┌─[ TOP ]${hr 2}${color}
${color2}│${color} ${top name 1}${goto 160}${top cpu 1}%${alignr}${top mem 1}%
${color2}│${color} ${top name 2}${goto 160}${top cpu 2}%${alignr}${top mem 2}%
${color2}│${color} ${top name 3}${goto 160}${top cpu 3}%${alignr}${top mem 3}%
${color1}└──────────────────────────────${color}
]]
